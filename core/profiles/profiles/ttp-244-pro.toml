[[quirks]]
id = "status-dialect"
note = "TSPL status: query ESC ! ? ([0x1B, 0x21, 0x3F]), reply is exactly one status byte - 0x01 head open, 0x02 jam, 0x04 paper out, 0x08 ribbon out, 0x10 paused, 0x40 cover open, 0x80 error; 0x20 (printing) is NOT a fault; any non-empty reply counts as answered"
evidence = "src-tauri/src/transport/status.rs:242-278"

[[quirks]]
id = "media-per-roll"
note = "Roll sensor type changes the job header: gap media -> GAP <gap> mm,0 mm (default), black mark -> BLINE, continuous -> GAP 0 mm,0 mm; it is a per-roll property, not a model property"
evidence = "src-tauri/src/transport/label_langs.rs:114-153"
