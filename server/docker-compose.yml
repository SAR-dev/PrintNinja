# PrintNinja v2 stack: the TypeScript service. First boot migrates the
# database itself (see ./docker-entrypoint.sh), so `docker compose up`
# lands healthy. Run from this directory: `docker compose up -d --build`.
# The env file is the `.env` next to this file (never committed).
#
# Two database modes, same image:
# - Bundled file (default): DATABASE_URL=file:/data/printninja.db keeps
#   everything in the named volume below. Zero configuration.
# - Turso Cloud: set DATABASE_URL=libsql://... plus DATABASE_AUTH_TOKEN
#   in `.env`; the volume is then unused.
name: printninja

services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Every variable env.example documents is passed through, default
    # included, so the stack cannot ignore a setting the docs promise
    # (TRUST_PROXY behind a proxy is the one that bit first: with 0,
    # every client behind the proxy shares one rate-limit bucket).
    # Keep in sync with server/env.example and docs/ENV.md.
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/printninja.db}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1420}
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      # Reverse-proxy hops to trust for the client IP (0 = none).
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Sessions and sync retention.
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_CLEANUP_MINUTES: ${SESSION_CLEANUP_MINUTES:-60}
      SYNC_TOMBSTONE_DAYS: ${SYNC_TOMBSTONE_DAYS:-90}
      SYNC_PAGE_BYTES: ${SYNC_PAGE_BYTES:-8388608}
      # Rate limits.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-300}
      # Password hashing cost (argon2id).
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-19456}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      # Scheduled cleanup endpoint secret: empty (the default) keeps
      # /v2/internal/cleanup disabled — Docker runs the in-process
      # timer instead, so leave it empty unless a scheduler calls in.
      CRON_SECRET: ${CRON_SECRET:-}
    # Least privilege: the service binds an unprivileged port and needs
    # no Linux capabilities or privilege escalation.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Let in-flight requests finish on SIGTERM (see server/src/server.ts).
    stop_grace_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Migrations run at boot, so the first readiness probe lands after
    # the schema is in place; /v2/ready also round-trips the database.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/v2/ready').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    volumes:
      # Backs the default file:/data/printninja.db. Unused with Turso.
      - printninja-data:/data
    ports:
      - "${SERVER_PORT:-3001}:3001"

volumes:
  printninja-data:
