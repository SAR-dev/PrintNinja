# Test runner for the Playwright e2e suite (e2e/Dockerfile). It mirrors the
# app-e2e CI job inside a Linux container, so a local run matches the runner
# (Node 22, pnpm 10, Chromium via `playwright install --with-deps`, Ubuntu
# 24.04 fonts) and is immune to host-OS quirks: Windows cannot always bind
# the worker ports (EACCES on 127.0.0.1:3101), and host-rendered screenshots
# never match the committed Linux baselines.
#
# The image bakes in the current checkout (rebuilt on every run), so the code
# under test is always the working tree — the same freshness as the rust-test
# runner, without a workspace bind mount (a mount would drag the host's
# platform-bound node_modules into the container).
#
#   # full suite (all projects)
#   pnpm e2e:docker
#
#   # one project, or a single test (override the image CMD):
#   docker compose -f e2e/docker-compose.e2e.yml run --rm e2e \
#     pnpm --filter e2e exec playwright test --project=mobile-pixel7
#   docker compose -f e2e/docker-compose.e2e.yml run --rm e2e \
#     pnpm --filter e2e exec playwright test -g "phone checks pass on /settings"
#
#   # rewrite the committed Linux baselines, then commit the PNGs (docs/CI.md):
#   E2E_UPDATE_SNAPSHOTS=true pnpm e2e:docker
name: printninja-e2e
services:
  e2e:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    image: printninja/e2e
    environment:
      # Match CI's 4 workers; lower for a lighter local run.
      E2E_WORKERS: ${E2E_WORKERS:-4}
      # Empty = compare against the committed baselines. "true" rewrites them.
      E2E_UPDATE_SNAPSHOTS: ${E2E_UPDATE_SNAPSHOTS:-}
    # Cargo's target for the vendored virtual printer survives between runs,
    # so after the first build only the printer itself recompiles.
    volumes:
      - e2e-vp-target:/workspace/e2e/support/virtual-printer/target
volumes:
  e2e-vp-target:
