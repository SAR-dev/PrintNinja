[package]
name = "pn-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Delivery e2e: the real pn-transport + pn-job driving the virtual printer
# fixture (see support/virtual-printer) as a subprocess. std-only on purpose —
# the HTTP state control is a hand-rolled GET over a TcpStream.
[dependencies]
pn-scene = { path = "../../core/scene" }
pn-browser = { path = "../../core/browser" }
pn-render = { path = "../../core/render" }
pn-planner = { path = "../../core/planner" }
pn-encoders = { path = "../../core/encoders" }
pn-transport = { path = "../../core/transport" }
pn-job = { path = "../../core/job" }
pn-profiles = { path = "../../core/profiles" }
