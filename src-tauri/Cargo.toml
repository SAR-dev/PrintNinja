[package]
name = "printninja"
version = "2026.1112.0"
description = "Cross-platform silent print app"
authors = ["PrintNinja"]
edition = "2021"

[lib]
name = "printninja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-android-print = { path = "../plugins/tauri-plugin-android-print" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
handlebars = "6"
# `{{barcode}}` / `{{qrcode}}` template helpers. Encoders only: the SVG is
# drawn in render/barcode.rs, so neither crate's image/SVG features are needed.
barcoders = { version = "2", default-features = false }
qrcode = { version = "0.14", default-features = false }
# Data Matrix, PDF417, Aztec and UPC-E encoders (ZXing port, Apache-2.0).
# `encoders` alone is not enough: the format features hard-error without a
# charset backend, so `encoding_rs` must ride along. `oned` gates UPC_E in
# the multi-format writer. The BitMatrix output is turned into inline SVG in
# render/barcode.rs — no image features needed.
rxing = { version = "0.9", default-features = false, features = ["encoders", "oned", "aztec", "datamatrix", "pdf417", "encoding_rs"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sha2 = "0.10"
hmac = "0.12"
url = "2"
urlencoding = "2"
hex = "0.4"
rand = "0.8"
# Persistent headless Edge driven over the DevTools protocol (render/cdp.rs).
# The `handshake` feature is what `client_async` needs; axum's `ws` already
# enables it, so this adds no crates. No TLS: the debugging port is plain
# ws:// on 127.0.0.1.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Screenshot decode for the raster print path (P4). Only referenced from
# cfg(windows) code — Edge's PNG output is decoded there; Linux/CI compile
# it but the call site lives behind the Windows cfg.
png = "0.17"
# Extraction of the opt-in chrome-headless-shell download (render/
# browser_download.rs). Like `png`, only referenced from cfg(windows)
# code; `deflate` is the only compression the Chrome for Testing zips use.
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2"
mdns-sd = "0.13"
# PDF-input rasterization (render/pdfium.rs): interprets a submitted PDF's
# first page into a 1-bit raster for command-language printers. The binary
# is vendored at resources/pdfium (pdfium.dll on Windows, libpdfium.so on
# Linux; Apache-2.0 — see its LICENSE.txt); the
# `pdfium_7881` binding pairs with the bundled build 8046d (the FPDF_LIBRARY
# function table is append-only, so a binding at or below the binary's
# revision is the safe direction). Desktop-only: on Android the PDF
# input is rendered on the device by the platform's own PDFium port
# (android.graphics.pdf.PdfRenderer, see render/mod.rs) instead of a
# bundled binary.
[target.'cfg(not(target_os = "android"))'.dependencies]
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7881", "thread_safe"] }
# euid check for the persistent Chromium launch: running as root without
# `--no-sandbox` is unsupported, and the flag must be decided at launch,
# not from refused stderr like the one-shot retry can.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Exposes `tauri::test` (mock app + IPC dispatch) for the Start-Server
# regression test. The `test` feature is empty — it only gates the test
# helpers, no runtime behavior changes.
tauri = { version = "2", features = ["test"] }
# Decode round-trip unit test in render/barcode.rs: every shipped symbology
# must decode back to the template value. `svg_read` rasterizes the
# renderer's SVG in-process via resvg, and `qrcode` + `decoders` enable the
# readers the app's encoder-only rxing build lacks. Dev features only — the
# app binary keeps the slim build.
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "svg_read"] }

# Mobile only: no extra pairing dependencies. Pairing is a typed
# 8-character code now; the camera QR scanner is gone
# (was QR scanner; now 8-char code — see docs/architecture/PHONE_AND_PC_SHARING.md#pairing).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Security", "Win32_System_Com"] }
# Elevation check (render/elevation.rs): GetCurrentProcess /
# OpenProcessToken / GetTokenInformation only — kernel32 + advapi32, so the
# module stays safe in the manifest-less test executables that the
# `windows` crate's comctl32-v6-linked dependencies would not be.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
