[package]
name = "printninja"
version = "4.0.0"
description = "Cross-platform silent print app"
authors = ["PrintNinja"]
edition = "2021"
# The Phase 0 spike (examples/direct_print_spike.rs + its `mod spike`
# file) is declared explicitly below; auto-discovery would build
# spike.rs as a standalone example and fail (it has no main).
autoexamples = false

[lib]
name = "printninja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-android-print = { path = "../plugins/tauri-plugin-android-print" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
handlebars = "6"
# `{{barcode}}` / `{{qrcode}}` template helpers. Encoders only: the SVG is
# drawn in render/barcode.rs, so neither crate's image/SVG features are needed.
barcoders = { version = "2", default-features = false }
qrcode = { version = "0.14", default-features = false }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http-body-util = "0.1"
sha2 = "0.10"
hmac = "0.12"
url = "2"
urlencoding = "2"
hex = "0.4"
rand = "0.8"
# Persistent headless Edge driven over the DevTools protocol (render/cdp.rs).
# The `handshake` feature is what `client_async` needs; axum's `ws` already
# enables it, so this adds no crates. No TLS: the debugging port is plain
# ws:// on 127.0.0.1.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Screenshot decode for the raster print path (P4). Only referenced from
# cfg(windows) code — Edge's PNG output is decoded there; Linux/CI compile
# it but the call site lives behind the Windows cfg.
png = "0.17"
tauri-plugin-opener = "2"
mdns-sd = "0.13"
# euid check for the persistent Chromium launch: running as root without
# `--no-sandbox` is unsupported, and the flag must be decided at launch,
# not from refused stderr like the one-shot retry can.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Exposes `tauri::test` (mock app + IPC dispatch) for the Start-Server
# regression test. The `test` feature is empty — it only gates the test
# helpers, no runtime behavior changes.
tauri = { version = "2", features = ["test"] }

# Mobile only: no extra pairing dependencies. Pairing is a typed
# 8-character code now; the camera QR scanner is gone
# (was QR scanner; now 8-char code — see docs/architecture/PHONE_AND_PC_SHARING.md#pairing).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Threading", "Win32_Security", "Win32_System_Com",
  # Direct printing (docs/planned/DIRECT_PRINTING.md): the Phase 0 spike tool
  # (examples/direct_print_spike.rs) needs these; Phases 1-4 keep them.
  "Win32_Foundation", "Win32_Storage_FileSystem",
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties",
  "Win32_Devices_Bluetooth", "Win32_Graphics_Gdi", "Win32_Graphics_Printing",
  "Win32_Networking_WinSock", "Win32_System_IO",
] }

[target.'cfg(windows)'.dev-dependencies]
# Phase 0 spike only (examples/direct_print_spike.rs): BLE scan/probe.
# BLE is out of scope for the plan, so this stays a dev-dependency.
btleplug = "0.11"

# Declare the Phase 0 spike (with `autoexamples = false` above):
# direct_print_spike.rs is the main, spike.rs its `mod spike`
# internals (Windows-only). Without this, spike.rs is auto-discovered
# as a standalone example with no main and fails `cargo test`.
[[example]]
name = "direct_print_spike"
